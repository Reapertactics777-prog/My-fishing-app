<!DOCTYPE html>
<html lang="af">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jy't ŉ Byt!!!!!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f0f4f8; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .catch-card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 15px; border-left: 5px solid #1e40af; }
    </style>
    <link rel="icon" type="image/png" href="1000419720%20(1).png">
    <link rel="manifest" href="manifest.json">
</head>
<body class="p-4 max-w-md mx-auto">

    <h1 class="text-3xl font-extrabold text-blue-900 mb-6 flex items-center gap-2">
        🎣 Jy't ŉ Byt!!!!!
    </h1>

    <div class="bg-white p-6 rounded-2xl shadow-lg mb-8 border border-blue-100">
        <h2 class="text-xl font-semibold mb-4 text-gray-800 border-b pb-2">Nuwe Vangs</h2>
        
        <label class="block text-sm font-medium text-gray-700 mb-1">Vis Spesie</label>
        <input type="text" id="species" placeholder="bv. Karp, Kurper, Baber" class="w-full mb-3 p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
        
        <label class="block text-sm font-medium text-gray-700 mb-1">Gewig (kg)</label>
        <input type="number" id="weight" placeholder="0.00" class="w-full mb-3 p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" step="0.01">
        
        <label class="block text-sm font-medium text-gray-700 mb-1">Hengelplek</label>
        <input type="text" id="locationInput" placeholder="Naam van dam of rivier" class="w-full mb-3 p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
        
        <label class="block text-sm font-medium text-gray-700 mb-1">Aas of "Muti"</label>
        <input type="text" id="bait" placeholder="Wat het gewerk?" class="w-full mb-4 p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
        
        <label class="block mb-2 text-sm font-semibold text-gray-600">Foto van die vis</label>
        <input type="file" id="photo" accept="image/*" class="w-full mb-5 text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor:pointer">
        
        <button onclick="saveCatch()" class="w-full bg-blue-700 text-white py-3 rounded-lg font-bold text-lg shadow-md hover:bg-blue-800 transition-all active:scale-95">
            Stoor Vangs
        </button>
    </div>

    <div id="stats" class="grid grid-cols-2 gap-4 mb-8 text-center">
        <div class="bg-blue-800 text-white p-3 rounded-xl shadow-md">
            <p class="text-xs uppercase font-bold opacity-80">Totale Vangste</p>
            <b id="totalCount" class="text-2xl">0</b>
        </div>
        <div class="bg-green-700 text-white p-3 rounded-xl shadow-md">
            <p class="text-xs uppercase font-bold opacity-80">Grootste Een</p>
            <b id="maxWeight" class="text-2xl">0 kg</b>
        </div>
    </div>

    <h2 class="text-xl font-bold mb-4 text-blue-900">Onlangse Vangste</h2>
    <div id="logList"></div>

    <script>
        let db;
        const request = indexedDB.open("FishingLogDB", 1);

        request.onupgradeneeded = e => {
            db = e.target.result;
            db.createObjectStore("catches", { keyPath: "id", autoIncrement: true });
        };

        request.onsuccess = e => {
            db = e.target.result;
            displayCatches();
        };

        function saveCatch() {
            const species = document.getElementById('species').value;
            const weight = parseFloat(document.getElementById('weight').value) || 0;
            const locationVal = document.getElementById('locationInput').value;
            const bait = document.getElementById('bait').value;
            const photoFile = document.getElementById('photo').files[0];

            if (!species || weight <= 0) {
                alert("Vul asseblief die vis en gewig in.");
                return;
            }

            const handleSave = (photoData = null) => {
                const entry = { 
                    species, 
                    weight, 
                    location: locationVal, 
                    bait, 
                    photoData, 
                    date: new Date().toLocaleDateString() 
                };
                
                const transaction = db.transaction(["catches"], "readwrite");
                const store = transaction.objectStore("catches");
                store.add(entry);
                
                transaction.oncomplete = () => {
                    window.location.reload();
                };
            };

            if (photoFile) {
                const reader = new FileReader();
                reader.onload = (e) => handleSave(e.target.result);
                reader.readAsDataURL(photoFile);
            } else {
                handleSave();
            }
        }

        function displayCatches() {
            const transaction = db.transaction("catches", "readonly");
            const store = transaction.objectStore("catches");
            const logList = document.getElementById('logList');
            let maxW = 0;
            let count = 0;

            logList.innerHTML = ''; // Clear list before loading

            store.openCursor(null, 'prev').onsuccess = e => {
                const cursor = e.target.result;
                if (cursor) {
                    count++;
                    const val = cursor.value;
                    if (val.weight > maxW) maxW = val.weight;
                    
                    const card = document.createElement('div');
                    card.className = "catch-card shadow-md";
                    card.innerHTML = `
                        <div class="flex justify-between items-start">
                            <div>
                                <b class="text-lg">${val.species}</b> <span class="text-blue-700">(${val.weight} kg)</span><br>
                                <span class="text-sm text-gray-600">📍 ${val.location || 'Onbekend'}</span><br>
                                <span class="text-xs bg-gray-100 text-gray-700 px-2 py-1 rounded inline-block mt-1">🪱 ${val.bait || 'Geen aas'}</span>
                            </div>
                            <div class="text-xs text-gray-400">${val.date}</div>
                        </div>
                        ${val.photoData ? `<img src="${val.photoData}" class="mt-3 rounded-lg w-full h-48 object-cover">` : ''}
                    `;
                    logList.appendChild(card);
                    cursor.continue();
                } else {
                    document.getElementById('totalCount').innerText = count;
                    document.getElementById('maxWeight').innerText = maxW + " kg";
                }
            };
        }
    <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
</body>
</html>
